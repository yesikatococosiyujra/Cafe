<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aromas y Sabores</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="fondo-login">
    <main class="caja-login">
        <section class="formulario-login">
            <h1>CAFETERIA<BR>ARTESANAL</h1>
            <input type="text" id="user_login" placeholder="Usuario o Correo">
            <input type="password" id="pass_login" placeholder="Contraseña">
            
            <p id="mensajeError" class="texto-error"></p>
            
            <button type="button" class="boton" onclick="ValidarLogin()">Verificar Datos</button>

            <a href="pages/inicio.html" id="enlaceEntrar" class="boton" style="display: none; margin-top: 15px;">Ingresar</a>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
